<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Deliberately no viewport-fit=cover. Capacitor's SystemBars plugin only
         pads the web view's parent by the keyboard inset when the page asks for
         cover *and* the system web view is >= 140 — and on Android 14 and below
         the window has already been shrunk by adjustResize, so that padding is
         subtracted a second time and collapses the web view to a sliver. The
         status bar is kept off the web layer by StatusBar.setOverlaysWebView
         instead; see src/lib/native/index.ts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA / add-to-home-screen. The manifest link is injected by
         vite-plugin-pwa at build time. -->
    <meta name="theme-color" content="#1b5e20" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plant Exp" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Plant Experiments</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
